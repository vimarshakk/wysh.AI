name: Wysh.AI CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          cd apps/api
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]'
      - name: Run tests
        run: |
          cd apps/api
          source .venv/bin/activate
          pytest -q
      - name: Run objective gate
        run: |
          cd apps/api
          source .venv/bin/activate
          python scripts/run_objective_gate.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd apps/api
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]'
      - name: Lint with flake8
        run: |
          cd apps/api
          source .venv/bin/activate
          pip install flake8
          python -m flake8 app/ tests/ scripts/
