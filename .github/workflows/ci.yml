name: Wysh.AI CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Python dependencies
        run: |
          cd apps/api
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]'
      - name: Install Node.js dependencies
        run: |
          cd apps/cql-runtime
          npm install
      - name: Run Python tests
        run: |
          cd apps/api
          source .venv/bin/activate
          pytest -q
      - name: Run Node.js tests
        run: |
          cd apps/cql-runtime
          npm test
      - name: Run objective gate
        run: |
          cd apps/api
          source .venv/bin/activate
          python scripts/run_objective_gate.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd apps/api
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]'
      - name: Lint with flake8
        run: |
          cd apps/api
          source .venv/bin/activate
          pip install flake8
          python -m flake8 app/ tests/ scripts/
      - name: Lint JavaScript
        run: |
          cd apps/cql-runtime
          npx eslint --no-error-on-unmatched-pattern src/ test/ || true
