[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wysh-ai-api"
version = "0.1.0"
description = "Wysh AI WMI-1 preclinical API scaffold"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.8,<3", "uvicorn>=0.30,<1", "cryptography>=43,<51"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.setuptools.package-data]
app = ["model-registry.json", "application-profiles-v1.json"]
